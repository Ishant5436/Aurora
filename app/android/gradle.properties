org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compile caches break when the project and the Flutter pub
# cache are on different Windows drives (D: vs C:), and the failure surfaces as a
# misleading "Could not close incremental caches ... already registered" error in
# plugins such as alarm and file_picker. A full compile is a little slower but
# works everywhere.
kotlin.incremental=false
