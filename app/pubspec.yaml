name: aurora
description: "Aurora: an alarm that makes you think"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  alarm: ^5.15.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  go_router: ^18.1.0
  google_fonts: ^9.0.0
  http: ^1.6.0
  path_provider: ^2.1.6
  provider: ^6.1.5+1
  record: ^7.1.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
